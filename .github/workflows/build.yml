name: Diagnose Android project structure

on:
  push:
    branches:
      - fix/tauri-android-workflow
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP and inspect build instructions
        shell: bash
        run: |
          set -euo pipefail
          ZIP="exiptv-komplett.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP missing"; exit 1; }
          rm -rf _src
          mkdir -p _src
          unzip -q "$ZIP" -d _src
          echo "===== TOP LEVEL ====="
          find _src -maxdepth 3 -type f | sort | head -200
          echo "===== ANDROID DOCS ====="
          DOC="$(find _src -path '*/docs/ANDROID.md' -o -name ANDROID.md | head -n1)"
          if [ -n "$DOC" ]; then sed -n '1,240p' "$DOC"; else echo "No Android guide found"; fi
          echo "===== TAURI CONFIG ====="
          while IFS= read -r f; do echo "--- $f"; sed -n '1,240p' "$f"; done < <(find _src -name tauri.conf.json -o -name tauri.conf.json5)
          echo "===== CARGO MANIFESTS ====="
          while IFS= read -r f; do echo "--- $f"; sed -n '1,220p' "$f"; done < <(find _src -name Cargo.toml | head -10)
          echo "===== NODE MANIFESTS ====="
          while IFS= read -r f; do echo "--- $f"; sed -n '1,180p' "$f"; done < <(find _src -name package.json | head -10)
          echo "===== LOCK / TOOLCHAIN FILES ====="
          find _src -maxdepth 5 \( -name 'Cargo.lock' -o -name 'rust-toolchain*' -o -name 'pnpm-lock.yaml' -o -name 'package-lock.json' -o -name 'yarn.lock' \) -print | sort
