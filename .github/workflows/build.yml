name: Inspect embedded Android workflow

on:
  push:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source ZIP and print original Android workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _src && mkdir -p _src
          unzip -q exiptv-komplett.zip -d _src
          echo "===== EMBEDDED ANDROID WORKFLOW ====="
          sed -n '1,320p' _src/.github/workflows/android-build.yml
          echo "===== ANDROID POST-PROCESS SCRIPT ====="
          sed -n '1,280p' _src/scripts/android-nachbereiten.py
          echo "===== KOTLIN PLUGIN GRADLE ====="
          sed -n '1,220p' _src/android-plugin/build.gradle.kts
          echo "===== VITE CONFIG ====="
          sed -n '1,180p' _src/vite.config.ts
