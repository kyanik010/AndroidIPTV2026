name: EXIPTV Android-Build (APK)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: ZIP-Projekt extrahieren
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(git ls-files '*.zip')
          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Erwartet wurde genau eine Projekt-ZIP, gefunden: ${#ZIPS[@]}"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi
          rm -rf _src
          mkdir -p _src
          unzip -q "${ZIPS[0]}" -d _src
          if [ ! -f _src/package.json ] || [ ! -f _src/src-tauri/tauri.conf.json ]; then
            echo "::error::Die ZIP enthält kein gültiges Tauri-Projekt im erwarteten Layout."
            find _src -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          echo "dir=_src" >> "$GITHUB_OUTPUT"
          echo "archive=${ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "Projekt-ZIP: ${ZIPS[0]}"
          node -e "const c=require('./_src/src-tauri/tauri.conf.json'); console.log('App:', c.productName, 'Version:', c.version)"

      - name: Rust-Einstiegspunkt für Android prüfen
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          echo "===== Rust source files ====="
          find src-tauri/src -maxdepth 3 -type f -name '*.rs' -print | sort
          echo "===== Entry point and Tauri builder references ====="
          grep -RniE 'mobile_entry_point|fn main|tauri::Builder|\.run\(' src-tauri/src --include='*.rs' || true
          echo "===== Cargo library and binary configuration ====="
          sed -n '1,240p' src-tauri/Cargo.toml
          echo "===== Main Rust files ====="
          while IFS= read -r file; do
            echo "--- $file"
            sed -n '1,260p' "$file"
          done < <(find src-tauri/src -maxdepth 2 -type f \( -name 'lib.rs' -o -name 'main.rs' \) | sort)

      - name: Tauri Android entry point sicherstellen
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("src-tauri/src/lib.rs")
          if not p.is_file():
              raise SystemExit("ERROR: src-tauri/src/lib.rs not found; refusing to guess the Rust library entry point")
          source = p.read_text(encoding="utf-8")
          if "tauri::mobile_entry_point" in source:
              print("Tauri mobile entry point already present.")
          else:
              pattern = re.compile(r"(?m)^(?P<indent>[ \t]*)pub\s+fn\s+run\s*\(")
              match = pattern.search(source)
              if not match:
                  raise SystemExit("ERROR: no pub fn run() found in src-tauri/src/lib.rs; cannot safely apply the Android entry-point attribute")
              source = source[:match.start()] + "#[cfg_attr(mobile, tauri::mobile_entry_point)]\n" + source[match.start():]
              p.write_text(source, encoding="utf-8")
              print("Added #[cfg_attr(mobile, tauri::mobile_entry_point)] to pub fn run().")
          PY
          echo "===== Verified mobile entry point ====="
          grep -n -B2 -A2 "mobile_entry_point\|pub fn run" src-tauri/src/lib.rs

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK aus Runner vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find /usr/local/lib/android -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -20 || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "ndk;27.1.12297006" \
            "platforms;android-33" "platforms;android-34" "platforms;android-35" \
            "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;35.0.0" \
            "platform-tools"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: exiptv-android-v1
          workspaces: _src/src-tauri

      - name: Projektbefehle prüfen
        working-directory: _src
        run: python3 scripts/befehle-pruefen.py

      - name: Frontend-Abhängigkeiten installieren
        working-directory: _src
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Frontend bauen
        working-directory: _src
        run: npm run build

      - name: Tauri CLI sicherstellen
        working-directory: _src
        run: npm install -D @tauri-apps/cli@^2

      - name: Android-Gradle-Projekt erzeugen
        working-directory: _src
        run: npx tauri android init --ci

      - name: Android-Berechtigungen und ExoPlayer-Plugin einfügen
        working-directory: _src
        run: python3 scripts/android-nachbereiten.py .

      - name: Gradle vorbereiten
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          AND="src-tauri/gen/android"
          test -f "$AND/gradlew" || { echo "::error::Tauri did not generate the Gradle wrapper"; exit 1; }
          chmod +x "$AND/gradlew"
          PROPS="$AND/gradle.properties"
          touch "$PROPS"
          grep -q "org.gradle.jvmargs" "$PROPS" || echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> "$PROPS"
          grep -q "org.gradle.daemon" "$PROPS" || echo "org.gradle.daemon=false" >> "$PROPS"
          grep -q "android.useAndroidX" "$PROPS" || echo "android.useAndroidX=true" >> "$PROPS"
          echo "===== Gradle properties ====="
          cat "$PROPS"

      - name: Android APK bauen
        working-directory: _src
        shell: bash
        run: |
          set -o pipefail
          if npx tauri android build --apk --target aarch64 2>&1 | tee /tmp/android-build.log; then
            echo "Android APK build succeeded."
          else
            echo "===== Gradle failure ====="
            awk '/FAILURE: Build failed/,0' /tmp/android-build.log | head -80 || true
            echo "===== Kotlin/Java errors ====="
            grep -n "^e: \|error: \|Caused by:" /tmp/android-build.log | head -40 || true
            echo "===== Last build log lines ====="
            tail -80 /tmp/android-build.log
            exit 1
          fi

      - name: Android build diagnostics
        if: failure()
        working-directory: _src
        shell: bash
        run: |
          AND="src-tauri/gen/android"
          echo "===== Generated Android project ====="
          ls -la "$AND" 2>/dev/null || echo "Android project directory missing"
          echo "===== SDK versions ====="
          grep -rn "compileSdk\|targetSdk\|minSdk" "$AND/app/build.gradle.kts" 2>/dev/null | head -20 || true
          echo "===== Gradle wrapper ====="
          grep distributionUrl "$AND/gradle/wrapper/gradle-wrapper.properties" 2>/dev/null || true
          echo "===== APK/AAB outputs ====="
          find "$AND" -name '*.apk' -o -name '*.aab' 2>/dev/null | head -30 || true

      - name: APK finden
        id: apk
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android -type f -name '*.apk' | sort | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            find src-tauri/gen/android -name '*.apk' -o -name '*.aab' | head -30
            exit 1
          fi
          echo "APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: EXIPTV-Android-v${{ steps.apk.outputs.version }}
          path: _src/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Aktuelles Android-Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-aktuell
          name: EXIPTV Android – aktueller Build
          body: |
            Automatisch erzeugte Android-APK aus dem aktuellen Build.
          prerelease: true
          files: _src/${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
